<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nirikshak.AI — Proactive Banking Intelligence</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel2:#0f1729; --border:#22304d;
  --text:#e8edf7; --muted:#93a2c2; --accent:#4f8cff; --accent2:#22c1a0;
  --warn:#f5a524; --danger:#f0506e; --good:#22c1a0;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef1f8;
    --border:#dbe2ee; --text:#141b2d; --muted:#5b6b8c;
  }
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef1f8;
  --border:#dbe2ee; --text:#141b2d; --muted:#5b6b8c;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{
  width:230px; flex:0 0 230px; background:var(--panel); border-right:1px solid var(--border);
  padding:18px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.brand .name{font-weight:700;font-size:15px;line-height:1.2}
.brand .sub{font-size:10.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:none;
  color:var(--muted);padding:10px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:500;
}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--accent);color:#fff}
.nav .icon{font-size:15px;width:18px;text-align:center}
.themebtn{margin-top:16px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--muted);font-size:12px;cursor:pointer}
/* Main */
.main{flex:1;min-width:0;padding:22px 26px 60px;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:20px;margin:0}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--border);font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.kpi .value{font-size:26px;font-weight:700}
.kpi .delta{font-size:11.5px;margin-top:4px}
.up{color:var(--good)} .down{color:var(--danger)}
.section-title{font-size:14.5px;font-weight:700;margin:0 0 12px}
.two-col{grid-template-columns:1.3fr 1fr}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
  padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge.pending{background:#f5a52422;color:var(--warn)}
.badge.accepted{background:#22c1a022;color:var(--good)}
.badge.dismissed{background:#f0506e22;color:var(--danger)}
.badge.savings{background:#4f8cff22;color:var(--accent)}
.badge.loan{background:#a97bff22;color:#a97bff}
.badge.card{background:#22c1a022;color:var(--good)}
.badge.insurance{background:#f5a52422;color:var(--warn)}
.badge.investment{background:#4f8cff22;color:var(--accent)}
.bar-track{background:var(--panel2);border-radius:999px;height:7px;overflow:hidden;width:100%}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
input[type=text],input[type=search],select{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:9px;font-size:13px;
}
button.btn{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
  font-size:12.5px;cursor:pointer;font-weight:600}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.good{background:var(--good);border-color:var(--good);color:#04241c}
button.btn.danger{background:var(--danger);border-color:var(--danger);color:#2a0510}
button.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.trigger-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel2);margin-bottom:10px;cursor:pointer}
.trigger-card:hover{border-color:var(--accent)}
.trigger-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.trigger-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.trigger-head .prod{font-weight:700;font-size:13.5px}
.trigger-signal{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.conf-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.reason-steps{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.reason-steps li{display:flex;gap:10px;font-size:12.5px;align-items:flex-start}
.reason-steps .dot{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.detail-empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 10px}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:var(--accent);flex:0 0 auto}
.cust-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.cust-name{font-weight:600;font-size:13px}
.cust-sub{font-size:11px;color:var(--muted)}
.chip{padding:2px 8px;border-radius:6px;background:var(--panel2);font-size:10.5px;color:var(--muted);border:1px solid var(--border)}
.scorebar{width:60px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);
  font-size:12.5px;cursor:pointer;font-weight:600}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.close-x{cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
canvas{max-width:100%}
.overflow-x{overflow-x:auto}
.stat-mini{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border)}
.stat-mini:last-child{border-bottom:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
.hidden{display:none !important}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.mobile-toggle{display:none}
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px #0006}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:inline-flex;align-items:center;gap:6px}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🔍</div>
      <div>
        <div class="name">Nirikshak.AI</div>
        <div class="sub">Proactive Banking Intelligence</div>
      </div>
    </div>
    <div class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="icon">📊</span>Dashboard</button>
      <button data-page="cockpit"><span class="icon">🧭</span>Decision Cockpit</button>
      <button data-page="customers"><span class="icon">👥</span>Customers</button>
      <button data-page="explain"><span class="icon">🧩</span>Explainability</button>
      <button data-page="engagement"><span class="icon">📣</span>Engagement</button>
    </div>
    <button class="themebtn" id="themeToggle">🌓 Toggle theme</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <button class="btn mobile-toggle" id="mobileToggle">☰ Menu</button>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Sense → Reason → Engage, across your customer base</p>
      </div>
      <span class="pill">🟢 Running fully client-side · demo data · no backend required</span>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('app-data').textContent);
let { customers, transactions, triggers, life_events } = DATA;

// ---------- theme ----------
const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark' ? 'light' : 'dark');
});

// ---------- mobile sidebar ----------
const sidebar = document.getElementById('sidebar');
document.getElementById('mobileToggle').addEventListener('click', ()=> sidebar.classList.toggle('open'));

// ---------- helpers ----------
const fmtINR = n => '₹' + Math.round(n).toLocaleString('en-IN');
const byId = (arr,id) => arr.find(x=>x.id===id);
const custById = id => byId(customers, id);
function initials(name){ return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase(); }
function statusBadge(s){ return `<span class="badge ${s}">${s}</span>`; }
function catBadge(c){ return `<span class="badge ${c.toLowerCase()}">${c}</span>`; }
function daysAgo(dateStr){
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now()-d.getTime())/86400000);
  if(diff<=0) return 'today';
  if(diff===1) return '1 day ago';
  if(diff<30) return diff+' days ago';
  return Math.floor(diff/30)+' mo ago';
}

// derived: transactions per customer
const txByCust = {};
transactions.forEach(t=>{ (txByCust[t.customer_id] = txByCust[t.customer_id]||[]).push(t); });
const eventsByCust = {};
life_events.forEach(e=>{ (eventsByCust[e.customer_id] = eventsByCust[e.customer_id]||[]).push(e); });
const triggersByCust = {};
triggers.forEach(t=>{ (triggersByCust[t.customer_id] = triggersByCust[t.customer_id]||[]).push(t); });

// ---------- routing ----------
const pages = {};
const pageMeta = {
  dashboard:{title:'Dashboard', sub:'Sense → Reason → Engage, across your customer base'},
  cockpit:{title:'Decision Cockpit', sub:'Review AI-generated triggers and act on them'},
  customers:{title:'Customers', sub:'Financial health, transactions and life events per customer'},
  explain:{title:'Explainability', sub:'Why the AI recommended this — full reasoning trace'},
  engagement:{title:'Engagement', sub:'Simulated nudges delivered to customers'},
};
let selectedTriggerId = triggers.find(t=>t.status==='pending')?.id ?? triggers[0]?.id;
let selectedCustomerId = null;
let cockpitFilter = {status:'all', category:'all'};

function navigate(page){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
  document.getElementById('pageTitle').textContent = pageMeta[page].title;
  document.getElementById('pageSub').textContent = pageMeta[page].sub;
  document.getElementById('content').innerHTML = pages[page]();
  attachPageHandlers(page);
  sidebar.classList.remove('open');
  window.scrollTo({top:0});
}
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-page]');
  if(btn) navigate(btn.dataset.page);
});

// =====================================================
// DASHBOARD
// =====================================================
pages.dashboard = function(){
  const totalCust = customers.length;
  const avgHealth = (customers.reduce((s,c)=>s+c.financial_health_score,0)/totalCust).toFixed(1);
  const pending = triggers.filter(t=>t.status==='pending').length;
  const accepted = triggers.filter(t=>t.status==='accepted').length;
  const avgConf = (triggers.reduce((s,t)=>s+t.confidence,0)/triggers.length*100).toFixed(0);

  const typeCounts = {};
  triggers.forEach(t=>{ typeCounts[t.trigger_type]=(typeCounts[t.trigger_type]||0)+1; });
  const typeEntries = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);

  const catCounts = {};
  triggers.forEach(t=>{ catCounts[t.product_category]=(catCounts[t.product_category]||0)+1; });

  const recent = [...triggers].slice(-6).reverse();

  return `
  <div class="grid kpis">
    <div class="card kpi"><div class="label">Total Customers</div><div class="value">${totalCust}</div><div class="delta up">20 active accounts</div></div>
    <div class="card kpi"><div class="label">Avg Financial Health</div><div class="value">${avgHealth}</div><div class="delta">out of 100</div></div>
    <div class="card kpi"><div class="label">Pending Triggers</div><div class="value">${pending}</div><div class="delta">awaiting review</div></div>
    <div class="card kpi"><div class="label">Accepted Nudges</div><div class="value">${accepted}</div><div class="delta up">avg confidence ${avgConf}%</div></div>
  </div>

  <div class="grid two-col">
    <div class="card">
      <div class="section-title">Triggers by Type</div>
      <canvas id="typeChart" height="220"></canvas>
    </div>
    <div class="card">
      <div class="section-title">Triggers by Product Category</div>
      <canvas id="catChart" height="220"></canvas>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="section-title">Recent Triggers</div>
    <div class="tablewrap"><table>
      <thead><tr><th>Customer</th><th>Product</th><th>Category</th><th>Confidence</th><th>Status</th></tr></thead>
      <tbody>
      ${recent.map(t=>{
        const c = custById(t.customer_id);
        return `<tr>
          <td>${c? c.name : '—'}</td>
          <td>${t.product_recommended}</td>
          <td>${catBadge(t.product_category)}</td>
          <td>${(t.confidence*100).toFixed(0)}%</td>
          <td>${statusBadge(t.status)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>
  `;
};

function drawBarChart(canvasId, labels, values, color){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth-32;
  const h = 220;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...values,1);
  const padL = 10, padB = 60, padT = 10;
  const barW = (w-padL*2)/values.length*0.6;
  const gap = (w-padL*2)/values.length;
  const cs = getComputedStyle(document.documentElement);
  const muted = cs.getPropertyValue('--muted').trim() || '#93a2c2';
  const text = cs.getPropertyValue('--text').trim() || '#e8edf7';
  values.forEach((v,i)=>{
    const bh = (h-padT-padB) * (v/max);
    const x = padL + i*gap + (gap-barW)/2;
    const y = h-padB-bh;
    const grad = ctx.createLinearGradient(0,y,0,h-padB);
    grad.addColorStop(0,color[0]); grad.addColorStop(1,color[1]);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,barW,bh,5) : ctx.rect(x,y,barW,bh);
    ctx.fill();
    ctx.fillStyle = text;
    ctx.font = '11px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(v, x+barW/2, y-6);
    ctx.fillStyle = muted;
    ctx.save();
    ctx.translate(x+barW/2, h-padB+8);
    ctx.rotate(-0.5);
    ctx.textAlign='right';
    ctx.font = '10px sans-serif';
    ctx.fillText(labels[i].replace(/_/g,' '), 0, 0);
    ctx.restore();
  });
}

function drawDonut(canvasId, entries){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth-32;
  const h = 220;
  canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const total = entries.reduce((s,[,v])=>s+v,0);
  const colors = ['#4f8cff','#22c1a0','#f5a524','#f0506e','#a97bff','#25b7d3'];
  const cx = 78, cy = h/2, r = 62, rin = 36;
  let start = -Math.PI/2;
  entries.forEach(([,v],i)=>{
    const angle = (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += angle;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rin,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  const cs = getComputedStyle(document.documentElement);
  ctx.fillStyle = cs.getPropertyValue('--text').trim();
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(total, cx, cy);
  // legend
  let ly = 30;
  entries.forEach(([k,v],i)=>{
    ctx.fillStyle = colors[i%colors.length];
    ctx.fillRect(170, ly-8, 10, 10);
    ctx.fillStyle = cs.getPropertyValue('--text').trim();
    ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${k} (${v})`, 186, ly-3);
    ly += 20;
  });
}

pages.cockpit = function(){
  const categories = [...new Set(triggers.map(t=>t.product_category))];
  const filtered = triggers.filter(t=>
    (cockpitFilter.status==='all'||t.status===cockpitFilter.status) &&
    (cockpitFilter.category==='all'||t.product_category===cockpitFilter.category)
  );
  if(!filtered.find(t=>t.id===selectedTriggerId) && filtered.length) selectedTriggerId = filtered[0].id;
  const sel = triggers.find(t=>t.id===selectedTriggerId);
  const selCust = sel ? custById(sel.customer_id) : null;

  return `
  <div class="row" style="margin-bottom:14px">
    <select id="filterStatus">
      <option value="all">All statuses</option>
      <option value="pending">Pending</option>
      <option value="accepted">Accepted</option>
      <option value="dismissed">Dismissed</option>
    </select>
    <select id="filterCategory">
      <option value="all">All categories</option>
      ${categories.map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
    <span class="pill">${filtered.length} trigger${filtered.length===1?'':'s'}</span>
  </div>
  <div class="grid two-col">
    <div>
      <div id="triggerList">
        ${filtered.map(t=>{
          const c = custById(t.customer_id);
          return `<div class="trigger-card ${t.id===selectedTriggerId?'selected':''}" data-tid="${t.id}">
            <div class="trigger-head">
              <div>
                <div class="trigger-signal" style="margin-bottom:2px">${c?c.name:'—'} · ${c?c.city:''}</div>
                <div class="prod">${t.product_recommended}</div>
              </div>
              <div style="text-align:right">
                ${catBadge(t.product_category)}<br>${statusBadge(t.status)}
              </div>
            </div>
            <div class="trigger-signal">${t.signal_detected}</div>
            <div class="conf-row"><span>Confidence</span>
              <div class="bar-track" style="width:100px"><div class="bar-fill" style="width:${t.confidence*100}%"></div></div>
              <span>${(t.confidence*100).toFixed(0)}%</span>
            </div>
          </div>`;
        }).join('') || '<div class="detail-empty">No triggers match this filter.</div>'}
      </div>
    </div>
    <div class="card" id="triggerDetail" style="align-self:start;position:sticky;top:16px">
      ${sel ? renderTriggerDetail(sel, selCust) : '<div class="detail-empty">Select a trigger to see details</div>'}
    </div>
  </div>`;
};

function renderTriggerDetail(t, c){
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">
    <div>
      <div class="section-title" style="margin-bottom:2px">${t.product_recommended}</div>
      <div class="trigger-signal">for ${c?c.name:'—'} (${c?c.account_type:''} · ${c?c.city:''})</div>
    </div>
    ${catBadge(t.product_category)}
  </div>
  <p style="font-size:13px;color:var(--muted);line-height:1.5">${t.explanation}</p>
  <div class="conf-row" style="margin:10px 0">
    <span>AI confidence</span>
    <div class="bar-track" style="width:120px"><div class="bar-fill" style="width:${t.confidence*100}%"></div></div>
    <span>${(t.confidence*100).toFixed(0)}%</span>
  </div>
  <div class="row" style="margin:14px 0">
    <button class="btn good" data-act="accepted" ${t.status==='accepted'?'disabled':''}>✓ Accept</button>
    <button class="btn danger" data-act="dismissed" ${t.status==='dismissed'?'disabled':''}>✕ Dismiss</button>
    <span class="pill">Current: ${statusBadge(t.status)}</span>
  </div>
  <div class="section-title" style="font-size:12.5px;margin-top:10px">Reasoning trace (${t.reasoning_trace.model})</div>
  <ol class="reason-steps">
    ${t.reasoning_trace.steps.map((s,i)=>`<li><span class="dot">${i+1}</span><span>${s}</span></li>`).join('')}
  </ol>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="viewExplainBtn">🧩 Full explainability view →</button>
  </div>
  `;
}

function attachCockpitHandlers(){
  document.getElementById('filterStatus')?.addEventListener('change', e=>{ cockpitFilter.status=e.target.value; navigate('cockpit'); });
  document.getElementById('filterCategory')?.addEventListener('change', e=>{ cockpitFilter.category=e.target.value; navigate('cockpit'); });
  document.querySelectorAll('.trigger-card').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedTriggerId = Number(el.dataset.tid); navigate('cockpit'); });
  });
  document.querySelectorAll('#triggerDetail [data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = byId(triggers, selectedTriggerId);
      if(t){ t.status = btn.dataset.act; navigate('cockpit'); }
    });
  });
  document.getElementById('viewExplainBtn')?.addEventListener('click', ()=> navigate('explain'));
}

pages.customers = function(){
  const sel = selectedCustomerId ? custById(selectedCustomerId) : null;
  return `
  <div class="grid two-col">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div class="section-title" style="margin:0">All Customers</div>
        <input type="search" id="custSearch" placeholder="Search name or city...">
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Customer</th><th>City</th><th>Type</th><th>Health</th><th>Triggers</th></tr></thead>
        <tbody id="custTbody">
          ${renderCustomerRows(customers)}
        </tbody>
      </table></div>

function renderCustomerRows(list){
  return list.map(c=>{
    const n = (triggersByCust[c.id]||[]).length;
    return `<tr class="cust-row" data-cid="${c.id}">
      <td><div class="cust-row"><div class="avatar">${initials(c.name)}</div>
        <div><div class="cust-name">${c.name}</div><div class="cust-sub">${c.occupation} · ${fmtINR(c.monthly_income)}/mo</div></div></div></td>
      <td>${c.city}</td>
      <td><span class="chip">${c.account_type}</span></td>
      <td><div class="row" style="gap:6px"><div class="bar-track scorebar"><div class="bar-fill" style="width:${c.financial_health_score}%"></div></div>${c.financial_health_score}</div></td>
      <td>${n}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="detail-empty">No matches</td></tr>';
}

function renderCustomerDetail(c){
  const tx = (txByCust[c.id]||[]);
  const totalIn = tx.filter(t=>t.transaction_type==='credit').reduce((s,t)=>s+t.amount,0);
  const totalOut = tx.filter(t=>t.transaction_type==='debit').reduce((s,t)=>s+t.amount,0);
  const evs = eventsByCust[c.id]||[];
  const trs = triggersByCust[c.id]||[];
  return `
  <div class="row" style="justify-content:space-between">
    <div class="row"><div class="avatar" style="width:44px;height:44px;font-size:16px">${initials(c.name)}</div>
      <div><div style="font-weight:700">${c.name}</div><div class="cust-sub">${c.email} · ${c.phone}</div></div></div>
    <span class="close-x" id="closeCustDetail">✕</span>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin:14px 0;gap:8px">
    <div class="stat-mini"><span>Age / Gender</span><span>${c.age} · ${c.gender}</span></div>
    <div class="stat-mini"><span>City</span><span>${c.city}</span></div>
    <div class="stat-mini"><span>Account</span><span>${c.account_number}</span></div>
    <div class="stat-mini"><span>Type</span><span>${c.account_type}</span></div>
    <div class="stat-mini"><span>Risk profile</span><span>${c.risk_profile}</span></div>
    <div class="stat-mini"><span>KYC</span><span>${c.kyc_status}</span></div>
    <div class="stat-mini"><span>Total credits</span><span class="up">+${fmtINR(totalIn)}</span></div>
    <div class="stat-mini"><span>Total debits</span><span class="down">-${fmtINR(totalOut)}</span></div>
  </div>
  <div class="section-title" style="font-size:12.5px">Financial health</div>
  <div class="row"><div class="bar-track"><div class="bar-fill" style="width:${c.financial_health_score}%"></div></div><b>${c.financial_health_score}</b></div>

  <div class="section-title" style="font-size:12.5px;margin-top:14px">Life events (${evs.length})</div>
  ${evs.slice(0,4).map(e=>`<div class="stat-mini"><span>${e.event_type.replace(/_/g,' ')}</span><span class="cust-sub">${daysAgo(e.date)}</span></div>`).join('') || '<div class="trigger-signal">None recorded</div>'}

  <div class="section-title" style="font-size:12.5px;margin-top:14px">Triggers for this customer (${trs.length})</div>
  ${trs.map(t=>`<div class="stat-mini"><span>${t.product_recommended}</span>${statusBadge(t.status)}</div>`).join('') || '<div class="trigger-signal">None yet</div>'}
  `;
}

function attachCustomerHandlers(){
  document.getElementById('custSearch')?.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    const filtered = customers.filter(c=>c.name.toLowerCase().includes(q)||c.city.toLowerCase().includes(q));
    document.getElementById('custTbody').innerHTML = renderCustomerRows(filtered);
    attachCustRowClicks();
  });
  attachCustRowClicks();
  document.getElementById('closeCustDetail')?.addEventListener('click', ()=>{ selectedCustomerId=null; navigate('customers'); });
}
function attachCustRowClicks(){
  document.querySelectorAll('.cust-row[data-cid]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedCustomerId = Number(el.dataset.cid); navigate('customers'); });
  });
}

// =====================================================
// dispatch page-specific handlers + charts
// =====================================================
function attachPageHandlers(page){
  if(page==='dashboard'){
    const typeCounts = {};
    triggers.forEach(t=>{ typeCounts[t.trigger_type]=(typeCounts[t.trigger_type]||0)+1; });
    const typeEntries = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);
    const catCounts = {};
    triggers.forEach(t=>{ catCounts[t.product_category]=(catCounts[t.product_category]||0)+1; });
    drawBarChart('typeChart', typeEntries.map(e=>e[0]), typeEntries.map(e=>e[1]), ['#4f8cff','#2a5fd0']);
    drawDonut('catChart', Object.entries(catCounts));
  }
  if(page==='cockpit') attachCockpitHandlers();
  if(page==='explain') attachExplainHandlers();
  if(page==='customers') attachCustomerHandlers();
}

window.addEventListener('resize', ()=>{
  if(document.getElementById('pageTitle').textContent==='Dashboard') attachPageHandlers('dashboard');
});

// init
navigate('dashboard');
})();
